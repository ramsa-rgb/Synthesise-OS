name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt update -y && sudo apt install gcc-arm-none-eabi -y

    - name: Build
      run: make

    - name: Clean
      run: make
