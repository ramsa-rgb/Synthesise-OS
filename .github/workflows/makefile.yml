name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: sudo apt update -y && sudo apt install gcc-arm-none-eabi nasm -y

    - name: Build ARMv6 (BCM2835)
      run: make ARMv6

    - name: Build x86 ()
      run: make X86

    - name: Clean
      run: make clean
